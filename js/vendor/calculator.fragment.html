<div id="calculator-widget" style="display:none;position:fixed;top:70px;right:30px;z-index:9998;cursor:grab;" onmousedown="startDragCalc(event)" ontouchstart="startDragCalcTouch(event)">
<div class="calc-wrapper" id="calcWrapper">
<div class="info-popup" id="infoPopup">
<button class="info-close" id="infoClose">✕</button>
<p>Button layout mimics the TI-30XS series to match PearsonVue's layout.</p>
</div>
<div class="calc-body" id="calcBody">
<canvas id="calcCosmicCanvas" style="position:absolute;inset:0;width:100%;height:100%;border-radius:inherit;pointer-events:none;opacity:0.45;z-index:0;"></canvas>
<div class="calc-header" style="position:relative;z-index:1;">
<button class="info-btn" id="infoBtnEl" title="About this layout">i</button>
<span class="brand-name">Quantifier-30 <span class="calc-beta">beta</span></span>
<div class="solar-panel"><canvas class="calc-theme-overlay" id="calcOverlaySolar"></canvas></div>
</div>
<div class="calc-display" id="calcDisplay">
<canvas class="calc-theme-overlay" id="calcOverlayDisplay"></canvas>
<div class="display-scanlines"></div>
<div class="display-status">
<div class="display-status-left">
<span id="dspAngle" class="stat-pill">DEG</span>
<span id="dspHyp" class="stat-pill" style="display:none">HYP</span>
<span id="dsp2nd" class="stat-pill" style="display:none">2ND</span>
</div>
<div class="display-status-right">
<span id="dspMem" style="display:none;font-size:8.5px;opacity:.8">M</span>
<span id="dspIns" class="stat-pill" style="display:none">OVR</span>
<span id="dspNav">↑↓</span>
</div>
</div>
<div class="display-expr" id="dspExpr"><span></span></div>
<div class="display-main" id="dspMain"><span><span class="blk-cursor">█</span></span></div>
<div id="errMsg"></div>
</div>
<div class="calc-buttons" id="btnArea">
<div class="btn-top-section">
<div class="btn-top-left">
<div class="btn-row">
<button class="calc-btn btn-2nd" id="btn2nd" data-id="2nd">2nd</button>
<button class="calc-btn btn-fn" data-id="mode"><span class="lbl2">quit</span><span class="lbl-main">mode</span></button>
<button class="calc-btn btn-fn" data-id="delete"><span class="lbl2">insert</span><span class="lbl-main">delete</span></button>
</div>
<div class="btn-row">
<button class="calc-btn btn-fn" data-id="log"><span class="lbl2">10ˣ</span><span class="lbl-main">log</span></button>
<button class="calc-btn btn-fn" data-id="prb"><span class="lbl2">angle</span><span class="lbl-main">prb</span></button>
<button class="calc-btn btn-fn" data-id="data"><span class="lbl2">stat</span><span class="lbl-main">data</span></button>
</div>
</div>
<div class="nav-pad-outer">
<div class="nav-row"><button class="nav-btn nav-corner">/</button><button class="nav-btn nav-arr" data-nav="up">▲</button><button class="nav-btn nav-corner">\</button></div>
<div class="nav-row"><button class="nav-btn nav-arr" data-nav="left">◀</button><button class="nav-btn nav-center" data-nav="center">●</button><button class="nav-btn nav-arr" data-nav="right">▶</button></div>
<div class="nav-row"><button class="nav-btn nav-corner">\</button><button class="nav-btn nav-arr" data-nav="down">▼</button><button class="nav-btn nav-corner">/</button></div>
</div>
</div>
<div class="btn-row-full">
<button class="calc-btn btn-fn" data-id="ln"><span class="lbl2">eˣ</span><span class="lbl-main">ln</span></button>
<button class="calc-btn btn-fn" data-id="nd"><span class="lbl2">Un/d</span><span class="lbl-main">n/d</span></button>
<button class="calc-btn btn-fn" data-id="x10n"><span class="lbl2">U↔d</span><span class="lbl-main" style="font-size:11px">×10ⁿ</span></button>
<button class="calc-btn btn-fn" data-id="table"><span class="lbl2">f↔d</span><span class="lbl-main">table</span></button>
<button class="calc-btn btn-clear" data-id="clear">clear</button>
</div>
<div class="btn-main-grid">
<button class="calc-btn btn-fn" data-id="pi"><span class="lbl2">hyp</span><span class="lbl-main">π</span></button>
<button class="calc-btn btn-fn" data-id="sin"><span class="lbl2">sin⁻¹</span><span class="lbl-main">sin</span></button>
<button class="calc-btn btn-fn" data-id="cos"><span class="lbl2">cos⁻¹</span><span class="lbl-main">cos</span></button>
<button class="calc-btn btn-fn" data-id="tan"><span class="lbl2">tan⁻¹</span><span class="lbl-main">tan</span></button>
<button class="calc-btn btn-op" data-id="div">÷</button>
<button class="calc-btn btn-fn" data-id="power"><span class="lbl2">ˣ√</span><span class="lbl-main">^</span></button>
<button class="calc-btn btn-fn" data-id="inv">x⁻¹</button>
<button class="calc-btn btn-fn" data-id="lparen"><span class="lbl2">%</span><span class="lbl-main">(</span></button>
<button class="calc-btn btn-fn" data-id="rparen">)</button>
<button class="calc-btn btn-op" data-id="mul">×</button>
<button class="calc-btn btn-fn" data-id="sqr"><span class="lbl2">√</span><span class="lbl-main">x²</span></button>
<button class="calc-btn btn-num" data-id="7">7</button>
<button class="calc-btn btn-num" data-id="8">8</button>
<button class="calc-btn btn-num" data-id="9">9</button>
<button class="calc-btn btn-op" data-id="sub">−</button>
<button class="calc-btn btn-fn" data-id="xyz"><span class="lbl2">clv</span><span class="lbl-main">xyz</span></button>
<button class="calc-btn btn-num" data-id="4">4</button>
<button class="calc-btn btn-num" data-id="5">5</button>
<button class="calc-btn btn-num" data-id="6">6</button>
<button class="calc-btn btn-op" data-id="add">+</button>
<button class="calc-btn btn-fn" data-id="sto"><span class="lbl2">rcl</span><span class="lbl-main">sto</span></button>
<button class="calc-btn btn-num" data-id="1">1</button>
<button class="calc-btn btn-num" data-id="2">2</button>
<button class="calc-btn btn-num" data-id="3">3</button>
<button class="calc-btn btn-fn" data-id="swap">⇆</button>
<button class="calc-btn btn-on" data-id="on"><span class="lbl2" style="color:#FF9090">off</span><span class="lbl-main">on</span></button>
<button class="calc-btn btn-num" data-id="0"><span class="lbl2" style="color:var(--label-y)">reset</span><span class="lbl-main">0</span></button>
<button class="calc-btn btn-num" data-id="dot"><span class="lbl2">,</span><span class="lbl-main">.</span></button>
<button class="calc-btn btn-fn" data-id="neg"><span class="lbl2">ans</span><span class="lbl-main">(-)</span></button>
<button class="calc-btn btn-enter" data-id="enter">enter</button>
</div>
</div>
</div>
</div>
</div>
